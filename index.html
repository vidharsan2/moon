<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --ink: #060912;
    --dust: #e6e2d6;
    --haze: #8fa3c7;
    --gold: #e0b04f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--dust);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  #caption {
    position: fixed; left: 0; right: 0;
    bottom: max(28px, env(safe-area-inset-bottom));
    padding: 0 24px;
    text-align: center;
    font-size: clamp(1.15rem, 2.6vw, 1.6rem);
    font-style: italic;
    letter-spacing: .02em;
    color: var(--haze);
    pointer-events: none;
    transition: opacity .7s ease;
  }
  #caption.hide { opacity: 0; }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--ink); font-size: 1.4rem; font-style: italic; color: var(--haze);
    transition: opacity .8s ease; z-index: 5;
  }
  #loading.done { opacity: 0; pointer-events: none; }

  #found {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    width: min(92vw, 420px);
    padding: 26px 26px 22px;
    border: 1px solid rgba(224, 176, 79, .45);
    border-radius: 14px;
    background: rgba(8, 12, 24, .82);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    text-align: center;
    transform: translate(-50%, 24px);
    opacity: 0; visibility: hidden;
    transition: opacity .6s ease, transform .6s ease, visibility 0s linear .6s;
    z-index: 4;
  }
  #found.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }
  #found h2 { font-weight: 600; font-size: 1.9rem; line-height: 1.15; }
  #found p { margin-top: 6px; color: var(--haze); font-size: 1.15rem; font-style: italic; }
  #pw {
    display: block; margin: 16px 0 18px; padding: 12px 10px;
    border-radius: 14px; background: rgba(224, 176, 79, .09);
    font-size: clamp(1.6rem, 6vw, 2.2rem); font-weight: 600; letter-spacing: .12em;
    color: var(--gold); word-break: break-all; user-select: all;
  }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .row button, .row a {
    font: inherit; font-size: 1.1rem; color: var(--dust); text-decoration: none; cursor: pointer;
    padding: 9px 20px; border-radius: 14px; border: 1px solid rgba(230, 226, 214, .35); background: transparent;
    transition: background .2s ease, border-color .2s ease;
  }
  .row a { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 600; }
  .row button:hover { background: rgba(230, 226, 214, .1); }
  .row a:hover { background: #f0c46a; }
  .row button:focus-visible, .row a:focus-visible { outline: 2px solid var(--dust); outline-offset: 3px; }
</style>
</head>
<body>

<canvas id="stage" aria-label="A 3D moon. Touch it to explore."></canvas>
<p id="caption" class="hide"></p>
<div id="loading"><span id="loadText">Making the moon…</span></div>

<section id="found" role="dialog" aria-live="polite" aria-labelledby="foundTitle">
  <h2 id="foundTitle">You found him.</h2>
  <p>He was carrying the password:</p>
  <output id="pw"></output>
  <div class="row">
    <button id="copy" type="button">Copy</button>
    <a id="go" href="#">Open the next page</a>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   SETTINGS — change these
   ============================================================ */
const CONFIG = {
  // The password shown here is read straight from config.js (the "pin" value)
  // so you only ever have to set it in ONE place. No need to edit it here.
  password: (window.CAPSULE && window.CAPSULE.pin) || "0000",

  // The page the "Open the next page" button goes to
  nextPage: "password.html",

  // Where the astronaut stands, in degrees.
  // lat: -90 (south pole) … 90 (north pole)
  // lon: 0 = the face you see first, 180 = the far side
  astronaut: { lat: -28, lon: 132 },

  // Optional: a real moon photo-map (equirectangular, e.g. "moon.jpg").
  // Leave "" to use the moon generated by this page.
  moonTexture: "",

  introCaption: "Touch the moon.",
  exploreCaption: "Drag to turn it. Scroll or pinch to zoom. Someone is standing up there.",

  // Texture size for the generated moon. Bigger = sharper but slower to prepare.
  textureWidth: 1536
};
/* ============================================================ */

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const R = 5;                                   // moon radius in scene units
const canvas = document.getElementById('stage');
const captionEl = document.getElementById('caption');
const loadingEl = document.getElementById('loading');
const loadText = document.getElementById('loadText');

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x060912);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 1200);

const sun = new THREE.DirectionalLight(0xfff3df, 2.2);
sun.position.set(-9, 4, 7);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x20283f, 1.0));

const moonGroup = new THREE.Group();
scene.add(moonGroup);

/* ---------- stars ---------- */
(function addStars() {
  function layer(count, size, opacity) {
    const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      const r = 400 + Math.random() * 300;
      pos.set([r * s * Math.cos(t), r * u, r * s * Math.sin(t)], i * 3);
      const k = 0.7 + Math.random() * 0.3, warm = Math.random();
      col.set([k * (0.85 + 0.15 * warm), k * 0.92, k * (1 - 0.15 * warm)], i * 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({
      size, sizeAttenuation: false, vertexColors: true, transparent: true, opacity, depthWrite: false
    })));
  }
  layer(2600, 1.1, 0.75);
  layer(260, 2.0, 0.95);
})();

/* ---------- soft halo behind the moon ---------- */
const halo = (function () {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 60, 128, 128, 128);
  g.addColorStop(0, 'rgba(170,190,235,0.55)');
  g.addColorStop(0.5, 'rgba(120,145,205,0.12)');
  g.addColorStop(1, 'rgba(100,120,190,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, transparent: true, opacity: 0.55, depthWrite: false
  }));
  s.scale.set(R * 2 * 1.75, R * 2 * 1.75, 1);
  scene.add(s);
  return s;
})();

/* ============================================================
   Procedural moon surface
   (maria, thousands of craters at 7 sizes, rims, ejecta, regolith)
   ============================================================ */
function hash(x, y, z, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177) + Math.imul(s, 2147483629)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = Math.imul(h ^ (h >>> 16), 2246822519);
  h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let fx = x - ix, fy = y - iy, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iy, iz, 1), b = hash(ix + 1, iy, iz, 1), c = hash(ix, iy + 1, iz, 1), d = hash(ix + 1, iy + 1, iz, 1);
  const e = hash(ix, iy, iz + 1, 1), f = hash(ix + 1, iy, iz + 1, 1), g = hash(ix, iy + 1, iz + 1, 1), h = hash(ix + 1, iy + 1, iz + 1, 1);
  const x1 = a + (b - a) * fx, x2 = c + (d - c) * fx, x3 = e + (f - e) * fx, x4 = g + (h - g) * fx;
  const y1 = x1 + (x2 - x1) * fy, y2 = x3 + (x4 - x3) * fy;
  return y1 + (y2 - y1) * fz;
}
function fbm(x, y, z, oct) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x, y, z); n += a; x *= 2.03; y *= 2.03; z *= 2.03; a *= 0.5; }
  return s / n;
}
function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

function generateMoon(W, onProgress, onDone) {
  const H = W >> 1;
  const colorCv = document.createElement('canvas'); colorCv.width = W; colorCv.height = H;
  const bumpCv = document.createElement('canvas'); bumpCv.width = W; bumpCv.height = H;
  const cctx = colorCv.getContext('2d'), bctx = bumpCv.getContext('2d');
  const cimg = cctx.createImageData(W, H), bimg = bctx.createImageData(W, H);
  const cd = cimg.data, bd = bimg.data;

  const F = [3, 6, 11, 20, 36, 64, 110];
  const O = F.map((_, k) => [k * 17.3 + 0.5, k * 5.1 + 2.2, k * 11.7 + 7.9]);
  let row = 0;

  function chunk() {
    const end = Math.min(H, row + 24);
    for (; row < end; row++) {
      const th = (row + 0.5) / H * Math.PI, sT = Math.sin(th), cT = Math.cos(th);
      for (let col = 0; col < W; col++) {
        const ph = (col + 0.5) / W * Math.PI * 2;
        // same mapping as THREE.SphereGeometry
        const px = -Math.cos(ph) * sT, py = cT, pz = Math.sin(ph) * sT;

        // maria: dark basalt plains, mostly on the face we see first (+z)
        const w = smooth(-0.3, 0.6, pz);
        const m = fbm(px * 1.7 + 3.1, py * 1.7 + 7.7, pz * 1.7 + 1.3, 4);
        const mare = smooth(0.53, 0.58, m + 0.2 * (w - 1));

        let h = (fbm(px * 5 + 11, py * 5 + 2, pz * 5 + 9, 4) - 0.5) * 0.006 - 0.0015 * mare;
        let bright = 0;
        const cs = 1 - 0.7 * mare;       // lava-flooded craters are shallower

        for (let k = 0; k < F.length; k++) {
          const f = F[k], o = O[k];
          const qx = px * f + o[0], qy = py * f + o[1], qz = pz * f + o[2];
          const ix = Math.floor(qx), iy = Math.floor(qy), iz = Math.floor(qz);
          for (let j = 0; j < 3; j++) {
            const s = (k * 3 + j) * 8;
            if (hash(ix, iy, iz, s) > 0.78) continue;
            const cx = ix + 0.34 + 0.32 * hash(ix, iy, iz, s + 1);
            const cy = iy + 0.34 + 0.32 * hash(ix, iy, iz, s + 2);
            const cz = iz + 0.34 + 0.32 * hash(ix, iy, iz, s + 3);
            const rad = 0.06 + 0.16 * Math.pow(hash(ix, iy, iz, s + 4), 1.5);
            const dx = qx - cx, dy = qy - cy, dz = qz - cz;
            const d2 = dx * dx + dy * dy + dz * dz, lim = 1.4 * rad;
            if (d2 > lim * lim) continue;
            const d = Math.sqrt(d2) / rad, rr = rad / f;
            if (d < 1) {
              h -= (1 - d * d) * 0.22 * rr * cs;                         // bowl
              if (k < 3) h += 0.05 * rr * Math.exp(-(d * d) / 0.02) * cs; // central peak
            }
            const rim = Math.exp(-Math.pow((d - 1.03) / 0.17, 2));
            h += 0.10 * rr * rim * cs;                                   // raised rim
            bright += 0.07 * rim;
            if (hash(ix, iy, iz, s + 5) > 0.85) bright += 0.10 * Math.max(0, 1.4 - d); // fresh, bright ejecta
          }
        }
        bright *= (1 - 0.5 * mare);

        const aHigh = 0.62 + (fbm(px * 9 + 5, py * 9 + 1, pz * 9 + 8, 3) - 0.5) * 0.24;
        const aMare = 0.30 + (fbm(px * 7 + 2, py * 7 + 6, pz * 7 + 3, 3) - 0.5) * 0.10;
        let a = aHigh + (aMare - aHigh) * mare + bright;
        a = Math.min(1, Math.max(0, a));

        const i4 = (row * W + col) * 4;
        cd[i4]     = a * (1.00 - 0.04 * mare) * 255;
        cd[i4 + 1] = a * 0.975 * 255;
        cd[i4 + 2] = a * (0.93 + 0.07 * mare) * 255;
        cd[i4 + 3] = 255;

        const v = (0.5 + 0.5 * Math.tanh(h * 80)) * 255;
        bd[i4] = bd[i4 + 1] = bd[i4 + 2] = v; bd[i4 + 3] = 255;
      }
    }
    onProgress(row / H);
    if (row < H) { setTimeout(chunk, 0); }
    else {
      cctx.putImageData(cimg, 0, 0); bctx.putImageData(bimg, 0, 0);
      onDone(colorCv, bumpCv);
    }
  }
  chunk();
}

/* tileable fine-grain noise, laid over the surface for close-up regolith */
function makeDetailTexture() {
  const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N);
  const periods = [8, 16, 32, 64], lattices = periods.map((p, i) => {
    const l = new Float32Array(p * p); for (let k = 0; k < l.length; k++) l[k] = Math.random(); return l;
  });
  function pn(l, p, x, y) {
    const fx = x * p, fy = y * p, ix = Math.floor(fx), iy = Math.floor(fy);
    let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const x0 = ix % p, y0 = iy % p, x1 = (ix + 1) % p, y1 = (iy + 1) % p;
    const a = l[y0 * p + x0], b = l[y0 * p + x1], c = l[y1 * p + x0], d = l[y1 * p + x1];
    return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0, amp = 0.5, n = 0;
    periods.forEach((p, i) => { s += amp * pn(lattices[i], p, x / N, y / N); n += amp; amp *= 0.6; });
    const v = (s / n) * 255, i4 = (y * N + x) * 4;
    img.data[i4] = img.data[i4 + 1] = img.data[i4 + 2] = v; img.data[i4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* ============================================================
   Astronaut
   ============================================================ */
function buildAstronaut() {
  const holder = new THREE.Group();
  const figure = new THREE.Group();
  holder.add(figure);

  const suit = new THREE.MeshStandardMaterial({ color: 0xf1f0ea, roughness: 0.75 });
  const trim = new THREE.MeshStandardMaterial({ color: 0x8c929c, roughness: 0.7 });
  const visor = new THREE.MeshPhongMaterial({ color: 0xc99a2e, specular: 0xffe9a0, shininess: 140 });

  function add(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); figure.add(m); return m;
  }
  // legs + boots
  [-1, 1].forEach(s => {
    add(new THREE.CylinderGeometry(0.014, 0.016, 0.055, 12), suit, s * 0.017, 0.046, 0);
    add(new THREE.BoxGeometry(0.03, 0.016, 0.044), trim, s * 0.017, 0.010, 0.006);
  });
  // torso, pack, belt
  add(new THREE.BoxGeometry(0.062, 0.07, 0.042), suit, 0, 0.108, 0);
  add(new THREE.BoxGeometry(0.066, 0.012, 0.046), trim, 0, 0.078, 0);
  add(new THREE.BoxGeometry(0.052, 0.07, 0.03), trim, 0, 0.112, -0.034);
  // arms (one waving)
  add(new THREE.CylinderGeometry(0.0125, 0.0125, 0.05, 10), suit, 0.044, 0.104, 0, 0, 0, -0.18);
  const wave = add(new THREE.CylinderGeometry(0.0125, 0.0125, 0.05, 10), suit, -0.052, 0.14, 0, 0, 0, 2.5);
  // helmet + visor
  add(new THREE.SphereGeometry(0.031, 24, 18), suit, 0, 0.168, 0);
  const v = add(new THREE.SphereGeometry(0.023, 20, 14), visor, 0, 0.169, 0.016); v.scale.set(1, 0.9, 0.8);

  figure.rotation.y = 0.7;
  holder.position.y = -0.004;

  // a little pennant beside him — a clue when you're close
  const poleMat = new THREE.MeshStandardMaterial({ color: 0xcfd2d8, roughness: 0.5 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 0.2, 8), poleMat);
  pole.position.set(0.13, 0.1, 0.02); holder.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.055),
    new THREE.MeshStandardMaterial({ color: 0xf0a6b8, roughness: 0.9, side: THREE.DoubleSide }));
  flag.position.set(0.175, 0.17, 0.02); holder.add(flag);

  // generous invisible click target
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hit.position.set(0, 0.1, 0); holder.add(hit);

  return { holder, hit };
}

/* ============================================================
   Build the moon once its surface is ready
   ============================================================ */
let moon, hitbox;
let detailTex;

function buildMoon(map, bump, bumpScale) {
  map.encoding = THREE.sRGBEncoding;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();
  bump.anisotropy = map.anisotropy;
  detailTex = makeDetailTexture();

  const mat = new THREE.MeshStandardMaterial({ map, bumpMap: bump, bumpScale, roughness: 1, metalness: 0 });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.detailMap = { value: detailTex };
    sh.fragmentShader = 'uniform sampler2D detailMap;\n' + sh.fragmentShader.replace(
      '#include <map_fragment>',
      '#include <map_fragment>\n float dn = texture2D(detailMap, vUv * vec2(60.0, 30.0)).r;\n diffuseColor.rgb *= 0.78 + 0.44 * dn;'
    );
  };
  moon = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 96), mat);
  moonGroup.add(moon);

  // place the astronaut
  const lat = THREE.MathUtils.degToRad(CONFIG.astronaut.lat), lon = THREE.MathUtils.degToRad(CONFIG.astronaut.lon);
  const dir = new THREE.Vector3(Math.sin(lon) * Math.cos(lat), Math.sin(lat), Math.cos(lon) * Math.cos(lat)).normalize();
  const a = buildAstronaut();
  a.holder.position.copy(dir).multiplyScalar(R);
  a.holder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  moonGroup.add(a.holder);
  hitbox = a.hit;

  start();
}

/* ============================================================
   Interaction + state
   ============================================================ */
let state = 'intro';           // intro → flying → explore → found
let introDist = 18;
const controls = new THREE.OrbitControls(camera, canvas);
controls.enabled = false;
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomSpeed = 0.7;
controls.minDistance = R + 0.7;

function fitDistance() {
  const halfV = THREE.MathUtils.degToRad(camera.fov / 2);
  const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
  return R / Math.sin(Math.min(halfV, halfH) * 0.78);
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  introDist = fitDistance();
  controls.maxDistance = Math.max(introDist, 16);
  if (state === 'intro') { camera.position.set(0, 0, introDist); camera.lookAt(0, 0, 0); }
}
window.addEventListener('resize', resize);
resize();

function setCaption(text) {
  captionEl.classList.add('hide');
  setTimeout(() => { captionEl.textContent = text; captionEl.classList.remove('hide'); }, text ? 450 : 0);
}

function flyTo(dist, ms, done) {
  const from = camera.position.length(), t0 = performance.now(), dur = reduceMotion ? 0 : ms;
  (function step(now) {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.set(0, 0, from + (dist - from) * e);
    camera.lookAt(0, 0, 0);
    if (t < 1) requestAnimationFrame(step); else done();
  })(t0);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects([moon, hitbox], false)[0];
}

function enterExplore() {
  state = 'flying';
  setCaption('');
  flyTo(R * 2.2, 1800, () => {
    controls.target.set(0, 0, 0);
    controls.enabled = true; controls.update();
    state = 'explore';
    setCaption(CONFIG.exploreCaption);
  });
}

const pwEl = document.getElementById('pw'), foundEl = document.getElementById('found');
const goEl = document.getElementById('go'), copyEl = document.getElementById('copy');
pwEl.textContent = CONFIG.password;
goEl.href = CONFIG.nextPage;

function foundHim() {
  state = 'found';
  captionEl.classList.add('hide');
  foundEl.classList.add('show');
}
copyEl.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(CONFIG.password); copyEl.textContent = 'Copied'; }
  catch (e) { copyEl.textContent = 'Select and copy'; }
  setTimeout(() => (copyEl.textContent = 'Copy'), 1800);
});

let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!down || !moon) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 600;
  down = null;
  if (moved > 8 || !quick) return;
  const hit = pick(e);
  if (!hit) return;
  if (state === 'intro') enterExplore();
  else if (state === 'explore' && hit.object === hitbox) foundHim();
});
canvas.addEventListener('pointermove', e => {
  if (!moon || e.buttons) return;
  const hit = pick(e);
  canvas.style.cursor = hit && (state === 'intro' || (state === 'explore' && hit.object === hitbox)) ? 'pointer' : (state === 'explore' ? 'grab' : 'default');
});

/* ---------- main loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  if (state === 'intro' && !reduceMotion) moonGroup.rotation.y += 0.0012;
  if (controls.enabled) {
    // turn more gently the closer you are to the surface
    controls.rotateSpeed = Math.min(1, Math.max(0.12, (camera.position.length() - R) / (R * 1.4)));
    controls.update();
  }
  const haloTarget = state === 'intro' ? 0.55 : 0.18;
  halo.material.opacity += (haloTarget - halo.material.opacity) * 0.05;
  renderer.render(scene, camera);
}

function start() {
  loadingEl.classList.add('done');
  setTimeout(() => loadingEl.remove(), 900);
  captionEl.textContent = CONFIG.introCaption;
  captionEl.classList.remove('hide');
  animate();
}

/* ---------- boot: real texture if given, otherwise generate ---------- */
function makeProcedural() {
  generateMoon(CONFIG.textureWidth,
    p => { loadText.textContent = 'Making the moon… ' + Math.round(p * 100) + '%'; },
    (colorCv, bumpCv) => {
      // bump heights were encoded so that 1 unit of bumpScale ≈ the moon's radius ÷ 40
      buildMoon(new THREE.CanvasTexture(colorCv), new THREE.CanvasTexture(bumpCv), 0.2);
    });
}
if (CONFIG.moonTexture) {
  new THREE.TextureLoader().load(CONFIG.moonTexture,
    tex => buildMoon(tex, tex, 0.12),
    undefined,
    () => makeProcedural());
} else {
  setTimeout(makeProcedural, 60);
}
</script>
</body>
