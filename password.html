<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locked</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root {
      --night: #0a2540;
      --coral: #ff6b8b;
      --butter: #ffe29a;
      --mint: #7fe5c4;
      --snow: #fff8f0;
      --snow-dim: #b9c7dc;
      --display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
      --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { background: var(--night); color: var(--snow); -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      font-family: var(--body);
      font-size: 1.1rem;
      line-height: 1.5;
      background:
        radial-gradient(80% 55% at 50% 105%, #2a6bb0 0%, transparent 70%),
        radial-gradient(60% 45% at 50% -5%, #1b3f73 0%, transparent 70%),
        var(--night);
    }

    main {
      width: min(100% - 2.5rem, 28rem);
      padding-block: 3rem;
      text-align: center;
    }

    .lock {
      margin: 0 auto 1.5rem;
      width: clamp(48px, 12vw, 60px);
      height: auto;
      opacity: 0.9;
    }

    h1 {
      margin: 0 0 0.6rem;
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(1.4rem, 5vw, 2rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .sub {
      margin: 0 0 2.25rem;
      color: var(--snow-dim);
    }

    form { display: grid; justify-items: center; gap: 1.5rem; }

    .pin-boxes {
      display: flex;
      gap: clamp(0.5rem, 2.5vw, 0.9rem);
    }

    .pin-boxes input {
      width: clamp(2.6rem, 11vw, 3.4rem);
      height: clamp(3.2rem, 13vw, 4rem);
      text-align: center;
      font-family: var(--display);
      font-size: clamp(1.5rem, 6vw, 2rem);
      color: var(--snow);
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(185, 199, 220, 0.4);
      border-radius: 14px;
      caret-color: var(--coral);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .pin-boxes input:focus {
      outline: none;
      border-color: var(--coral);
      background: rgba(255, 255, 255, 0.1);
    }

    .shake { animation: shake 0.45s ease; }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(3px); }
      30%, 50%, 70% { transform: translateX(-7px); }
      40%, 60% { transform: translateX(7px); }
    }
    .shake input { border-color: var(--coral); }

    .btn {
      display: inline-block;
      padding: 1rem 2.6rem;
      border-radius: 999px;
      background: var(--coral);
      color: var(--night);
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.02rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 107, 139, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255, 107, 139, 0.5); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid var(--butter); outline-offset: 4px; }
    .btn[disabled] { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

    .msg { min-height: 1.4em; margin: 0; font-size: 0.95rem; }
    .msg.err { color: var(--coral); }
    .msg.ok { color: var(--mint); }

    body.unlocked main { animation: fade 0.5s ease both; }
    @keyframes fade { from { opacity: 1; } to { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
      .btn { transition: none; }
      body.unlocked main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="lock" viewBox="0 0 48 56" aria-hidden="true" focusable="false">
      <rect x="1" y="24" width="46" height="31" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M12 24V16a12 12 0 0 1 24 0v8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="24" cy="37" r="4" fill="currentColor"/>
      <rect x="22.4" y="39" width="3.2" height="8" rx="1.4" fill="currentColor"/>
    </svg>

    <h1 id="title">This one needs a PIN</h1>
    <p class="sub" id="sub">Only one person knows it. Ask them.</p>

    <form id="form" autocomplete="off">
      <div class="pin-boxes" id="boxes"></div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <button class="btn" id="go" type="submit" disabled>Unlock</button>
    </form>
  </main>

  <script>
    (function () {
      var C = window.CAPSULE;
      var LEN = (C.pin || "0000").length;
      var boxes = document.getElementById("boxes");
      var form = document.getElementById("form");
      var msg = document.getElementById("msg");
      var go = document.getElementById("go");
      var inputs = [];

      document.getElementById("title").textContent = C.pinTitle || "This one needs a PIN";
      document.getElementById("sub").textContent = C.pinHint || "Only one person knows it. Ask them.";

      for (var i = 0; i < LEN; i++) {
        var inp = document.createElement("input");
        inp.type = "tel";
        inp.inputMode = "numeric";
        inp.pattern = "[0-9]*";
        inp.maxLength = 1;
        inp.autocomplete = "off";
        inp.setAttribute("aria-label", "PIN digit " + (i + 1));
        boxes.appendChild(inp);
        inputs.push(inp);
      }

      function currentPin() {
        return inputs.map(function (i) { return i.value; }).join("");
      }

      function updateGo() {
        go.disabled = currentPin().length !== LEN;
      }

      inputs.forEach(function (inp, idx) {
        inp.addEventListener("input", function () {
          inp.value = inp.value.replace(/[^0-9]/g, "").slice(-1);
          if (inp.value && idx < LEN - 1) inputs[idx + 1].focus();
          updateGo();
          msg.textContent = "";
          msg.className = "msg";
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Backspace" && !inp.value && idx > 0) inputs[idx - 1].focus();
        });
        inp.addEventListener("paste", function (e) {
          var text = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "");
          if (!text) return;
          e.preventDefault();
          text.slice(0, LEN).split("").forEach(function (ch, i) { if (inputs[i]) inputs[i].value = ch; });
          var next = Math.min(text.length, LEN) - 1;
          if (inputs[next]) inputs[next].focus();
          updateGo();
        });
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (currentPin() === (C.pin || "")) {
          msg.textContent = "That's the one.";
          msg.className = "msg ok";
          go.disabled = true;
          sessionStorage.setItem("capsuleUnlocked", "1");
          document.body.classList.add("unlocked");
          setTimeout(function () { location.href = "main.html"; }, 500);
        } else {
          msg.textContent = "Not quite. Try again.";
          msg.className = "msg err";
          boxes.classList.remove("shake");
          void boxes.offsetWidth;
          boxes.classList.add("shake");
          inputs.forEach(function (i) { i.value = ""; });
          inputs[0].focus();
          updateGo();
        }
      });

      inputs[0].focus();
    })();
  </script>
</body>
</html>
